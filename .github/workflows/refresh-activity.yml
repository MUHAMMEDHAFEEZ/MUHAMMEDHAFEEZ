name: Refresh activity chart

# Redraws assets/activity-*.svg from the live contribution calendar.
#
# Requires a personal access token with the `read:user` scope, stored as the
# repository secret PROFILE_TOKEN. The default GITHUB_TOKEN is NOT enough:
# it authenticates as github-actions[bot], which can only see public
# contributions — most of this profile's activity is in private repos, so the
# chart would come back nearly empty. scripts/gen_activity.py refuses to run
# in that case rather than committing a wrong chart.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily (05:00 Cairo)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redraw the heatmap
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PROFILE_TOKEN is not set. Create a token with the" \
                 "'read:user' scope and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          python3 scripts/gen_activity.py

      - name: Commit if the chart changed
        run: |
          if git diff --quiet -- assets; then
            echo "No change today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh activity chart"
          git push
